[project]
name = "msi"
version = "1.0.0"
description = "Synthetic skill data, retrieval anchors, LoRA training and evaluation"
requires-python = ">=3.10,<3.13"
readme = "README.md"
dependencies = [
    "accelerate>=1.10.0,<2",
    "datasets>=3.0.0,<5",
    "latex2sympy2>=1.0.0",
    "networkx>=3.0",
    "numpy>=2.0.0,<3",
    "openai>=1.50.0,<3",
    "pandas>=2.2.0",
    "peft>=0.16.0,<0.20",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "requests>=2.32.0",
    "scipy>=1.14.0",
    "sentence-transformers>=3.0.0,<6",
    "sympy>=1.12",
    "tensorboard>=2.18.0",
    "torch>=2.5.0,<2.12",
    "tqdm>=4.67.0",
    "transformers>=5.2.0,<5.10",
    "vllm>=0.15.0,<0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/msi"]

[project.scripts]
msi = "msi.cli:main"


# Reference hardware: NVIDIA A800-SXM4-80GB (80 GB per GPU).
# One or more GPUs: independent inference shards, one server per GPU.
schema: msi.evaluate
run_id: paper
model:
  name: Llama-3.2-3B-Instruct
  path: models/Llama-3.2-3B-Instruct
paths:
  corpus: data/protocol/skills.json
  instances_dir: SR-Agents/data/bench/instances
  adapter_dir: work/{run_id}/adapters
  retrieval:
    bge_base:
      theoremqa: results/retrieval/theoremqa/bge_base.json
      medcalcbench: results/retrieval/medcalcbench/bge_base.json
      logicbench: results/retrieval/logicbench/bge_base.json
      toolqa: results/retrieval/toolqa/bge_base.json
    bge_base_rerank:
      theoremqa: results/retrieval/theoremqa/bge_base_rerank.json
      medcalcbench: results/retrieval/medcalcbench/bge_base_rerank.json
      logicbench: results/retrieval/logicbench/bge_base_rerank.json
      toolqa: results/retrieval/toolqa/bge_base_rerank.json
    bge_m3:
      theoremqa: results/retrieval/theoremqa/bge_m3.json
      medcalcbench: results/retrieval/medcalcbench/bge_m3.json
      logicbench: results/retrieval/logicbench/bge_m3.json
      toolqa: results/retrieval/toolqa/bge_m3.json
    bge_m3_rerank:
      theoremqa: results/retrieval/theoremqa/bge_m3_rerank.json
      medcalcbench: results/retrieval/medcalcbench/bge_m3_rerank.json
      logicbench: results/retrieval/logicbench/bge_m3_rerank.json
      toolqa: results/retrieval/toolqa/bge_m3_rerank.json
    bm25:
      theoremqa: results/retrieval/theoremqa/bm25.json
      medcalcbench: results/retrieval/medcalcbench/bm25.json
      logicbench: results/retrieval/logicbench/bm25.json
      toolqa: results/retrieval/toolqa/bm25.json
    paper_ft:
      theoremqa: data/routing/theoremqa.json
      logicbench: data/routing/logicbench.json
      toolqa: data/routing/toolqa.json
      medcalcbench: data/routing/medcalcbench.json
    random_same_domain:
      theoremqa: data/routing/random/theoremqa_s101.json
      logicbench: data/routing/random/logicbench_s101.json
      toolqa: data/routing/random/toolqa_s101.json
      medcalcbench: data/routing/random/medcalcbench_s101.json
  output_dir: results/inference/{run_id}
  eval_dir: results/eval/{run_id}
  work_dir: work
  cache_dir: work/{run_id}/cache
  external_dir: data/external
  toolqa_embedding_model: models/all-mpnet-base-v2
runtime:
  api_base: null
  port: 8100
  gpu_memory_utilization: 0.92
  max_model_len: 65536
retrieval_profiles:
  bge_base:
    retriever: bge
    model: models/bge-base-en-v1.5
    top_k: 10
    batch_size: 256
  bge_base_rerank:
    source_profile: bge_base
    reranker_model: models/bge-reranker-v2-m3
    top_k: 10
    batch_size: 32
    max_length: 512
  bge_m3:
    retriever: bge_m3
    model: models/bge-m3
    top_k: 10
    batch_size: 256
  bge_m3_rerank:
    source_profile: bge_m3
    reranker_model: models/bge-reranker-v2-m3
    top_k: 10
    batch_size: 32
    max_length: 512
  bm25:
    retriever: bm25
    top_k: 10
  paper_ft:
    frozen: true
    required_profile: bge_m3_ft_synthetic
  random_same_domain:
    frozen: true
    required_profile: random_same_domain
methods:
- naive
- golden_skill
- golden_skill_2shot
- golden_lora
- golden_lora_text
- bge_m3_top1
- retrieved_lora
- retrieved_lora_text
method_retrieval:
  mismatched_lora: random_same_domain
  bge_base_top1: bge_base
  bge_base_rerank_top1: bge_base_rerank
  bge_m3_top1: paper_ft
  bge_m3_rerank_top1: bge_m3_rerank
  bm25_top1: bm25
  retrieved_lora: paper_ft
  retrieved_lora_notext_text: paper_ft
  retrieved_lora_text: paper_ft
method_adapters:
  golden_lora: notext
  golden_lora_notext_text: notext
  retrieved_lora: notext
  retrieved_lora_notext_text: notext
  golden_lora_text: withtext
  retrieved_lora_text: withtext
defaults:
  workers: 128
  temperature: 0.0
  lora_backend: vllm
  fallback: error
  eval_workers: 32
  max_loaded_loras: 16
overrides:
  datasets: {}
  models: {}
  skills: {}
demos_file: data/demos/two_shot.json

  Llama-3.2-3B-Instruct: models/Llama-3.2-3B-Instruct
  Apertus-8B-Instruct-2509: models/Apertus-8B-Instruct-2509
retrievers:
  bge_base: models/bge-base-en-v1.5
  bge_m3: models/bge-m3
  bge_reranker: models/bge-reranker-v2-m3

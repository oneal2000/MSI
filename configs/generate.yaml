# Reference hardware: NVIDIA A800-SXM4-80GB (80 GB per GPU).
# Teacher serving uses tensor parallelism across the selected GPUs.
schema: msi.generate
run_id: paper
paths:
  shared_root: .
  corpus: data/protocol/skills.json
  test_instances:
    theoremqa: SR-Agents/data/bench/instances/theoremqa.json
    medcalcbench: SR-Agents/data/bench/instances/medcalcbench.json
    logicbench: SR-Agents/data/bench/instances/logicbench.json
    toolqa: SR-Agents/data/bench/instances/toolqa.json
  synthetic_dir: data/synthetic
  work_dir: work
  cache_dir: work/{run_id}/cache
  external_dir: data/external
  toolqa_embedding_model: models/all-mpnet-base-v2
teacher:
  model: Qwen/Qwen3.5-122B-A10B
  path: models/Qwen3.5-122B-A10B
  api_base: null
  task_model: null
  task_api_base: null
  trajectory_model: null
  trajectory_api_base: null
  evaluator_model: null
  evaluator_api_base: null
  tokenizer: null
runtime:
  port: 8000
  gpu_memory_utilization: 0.92
  max_model_len: 65536
  skill_lookahead: true
  skill_lookahead_threshold: 32
  skill_lookahead_poll_seconds: 5
defaults:
  phase: all
  evaluator: true
  min_acceptable: 480
  task_oversample: 1.1
  workers: 10
  temperature: 0.7
  task_temperature: 1.0
  delay: 0
  max_rounds: 16
  retry_failed: false
  dedup_threshold: 0.88
  near_threshold: 0.92
overrides:
  datasets: {}
  models: {}
  skills: {}
